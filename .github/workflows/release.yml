name: macOS Release (Self-Signed)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-sign-smoke:
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      APP_BUNDLE_ID: io.github.joemild.macpastenext
      APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
      # Exposed at job level so subsequent step conditionals can test it.
      # Empty value means: skip update signing + appcast generation.
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure scripts executable
        run: chmod +x scripts/*.sh

      - name: Validate macOS toolchain availability
        run: |
          for cmd in swift python3 sips iconutil plutil security codesign spctl; do
            if ! command -v "$cmd" >/dev/null 2>&1; then
              echo "Missing required command: $cmd"
              exit 1
            fi
          done

      - name: Validate release scripts syntax
        run: |
          bash -n scripts/build-release.sh
          bash -n scripts/sign-selfsigned.sh
          bash -n scripts/smoke-test-macos.sh
          bash -n scripts/validate-release-inputs.sh
          bash -n scripts/sparkle-bootstrap.sh
          bash -n scripts/sparkle-publish-update.sh

      - name: Validate resolved release metadata
        run: |
          echo "APP_VERSION=${APP_VERSION}"
          echo "APP_BUNDLE_ID=${APP_BUNDLE_ID}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${APP_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "APP_VERSION must match tag name for tag builds."
            exit 1
          fi
          if [ "${APP_BUNDLE_ID}" != "io.github.joemild.macpastenext" ]; then
            echo "Unexpected APP_BUNDLE_ID: ${APP_BUNDLE_ID}"
            exit 1
          fi

      - name: Validate tag release inputs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ./scripts/validate-release-inputs.sh "$TAG_NAME"

      - name: Generate release notes from changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ./scripts/extract-changelog.sh "$TAG_NAME" CHANGELOG.md release-notes.md require-entry

      - name: Build app bundle
        run: ./scripts/build-release.sh

      - name: Validate signing secrets
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          MAC_CERT_IDENTITY: ${{ secrets.MAC_CERT_IDENTITY }}
        run: |
          for secret_name in MAC_CERT_P12_BASE64 MAC_CERT_P12_PASSWORD MAC_CERT_IDENTITY; do
            if [ -z "${!secret_name:-}" ]; then
              echo "Missing required GitHub secret: $secret_name"
              exit 1
            fi
          done

      - name: Self-sign app bundle (persistent identity)
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
          MAC_CERT_IDENTITY: ${{ secrets.MAC_CERT_IDENTITY }}
        run: ./scripts/sign-selfsigned.sh dist/MacPasteNext.app

      - name: Run signed-app smoke test
        env:
          EXPECTED_BUNDLE_ID: io.github.joemild.macpastenext
          EXPECTED_IDENTITY: ${{ secrets.MAC_CERT_IDENTITY }}
        run: ./scripts/smoke-test-macos.sh dist/MacPasteNext.app

      - name: Archive artifact
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent dist/MacPasteNext.app dist/MacPasteNext-macos-arm64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: MacPasteNext-macos-arm64
          path: dist/MacPasteNext-macos-arm64.zip

      - name: Sign update with Sparkle and generate appcast
        if: startsWith(github.ref, 'refs/tags/') && env.SPARKLE_ED_PRIVATE_KEY != ''
        env:
          APP_NAME: MacPasteNext
          MIN_OS_VERSION: "13.0"
          RELEASES_DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download
        run: |
          ./scripts/sparkle-publish-update.sh \
            dist/MacPasteNext-macos-arm64.zip \
            "${GITHUB_REF_NAME}" \
            release-notes.md \
            dist/appcast.xml

      - name: Warn if Sparkle signing skipped
        if: startsWith(github.ref, 'refs/tags/') && env.SPARKLE_ED_PRIVATE_KEY == ''
        run: |
          echo "::warning::SPARKLE_ED_PRIVATE_KEY secret is not set; release will publish without an appcast.xml. Run scripts/sparkle-bootstrap.sh on macOS once and add the secret + variable to enable auto-updates."

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          body_path: release-notes.md
          files: |
            dist/MacPasteNext-macos-arm64.zip
            dist/appcast.xml
          fail_on_unmatched_files: false
